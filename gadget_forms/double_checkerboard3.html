<!--- Version 2 has crib dragging -->
<!--- Version 3 has local storage and converts digital checkerboards into alphabetic checkerboards-->
<HTML>
<!-- written by BION -->
<HEAD>
<META charset="utf-8">
<link rel="shortcut icon" href="Bicon16_alt2.ico">
<TITLE>Double Checkerboard Worksheet</TITLE>
<script type="text/javascript">

//next definition needed by Internet explorer, firefox already has it
if (!Array.prototype.indexOf)
{
  Array.prototype.indexOf = function(elt /*, from*/)
  {
    var len = this.length;

    var from = Number(arguments[1]) || 0;
    from = (from < 0)
         ? Math.ceil(from)
         : Math.floor(from);
    if (from < 0)
      from += len;

    for (; from < len; from++)
    {
      if (from in this &&
          this[from] === elt)
        return from;
    }
    return -1;
  };
}

var code,code_array,crib_pos,cribtext;
var symbols="abcdefghijklmnopqrstuvwxyz-"
var digits="0123456789";
var letters="ABCDEFGHIJKLMNOPQRSTUVWXYZ-"
var fire_fox=!document.all;
var dobj, solving_flag =0;
var asize = 5;
var line_len = 90;
var crib_entered=0;
var pair_line_limit=28;
var last_cell='', numb_repeats;
var selected_plaintext_pos = -1;
var selected_key_cell = '';
var double_ck_flag = 0;
var data;


//try associative array for key
var check_key = new Array();
var left_outer_key = new Array();
var left_inner_key = new Array();
var top_outer_key = new Array();
var top_inner_key = new Array();
var rows_selected = new Array();
// a border label's element id is its position digit followed by one of these suffixes
var border_keys = {key_top_outer: top_outer_key, key_top_inner: top_inner_key, key_left_outer: left_outer_key, key_left_inner: left_inner_key};
var selected_border_id = '';
var columns_selected = new Array();

function reset_key() {
	var i,j;
	for (i=0;i<asize;i++) for (j=0;j<asize;j++) {
		check_key[ digits.charAt(i)+digits.charAt(j) ] = '-';
	}
	for (i=0;i<asize;i++) {
		left_outer_key[digits.charAt(i)]='-';
		left_inner_key[digits.charAt(i)]='-';
		top_outer_key[digits.charAt(i)]='-';
		top_inner_key[digits.charAt(i)]='-';
	}
}

function clear_plaintext(){ // leave outer and inner keys alone
	var i,j;
	for (i=0;i<asize;i++) for (j=0;j<asize;j++) {
		check_key[ digits.charAt(i)+digits.charAt(j) ] = '-';
	}
	restore_keyblock();
	xlate();
}

function input_ok() {
	var s='Ciphertext: (Type or paste cipher into this box. Note: digits will be converted into letters)<BR>';
	s=s+'<TEXTAREA id=cipher_place style="font-family:monospace" name=output_area rows=9 cols=90></TEXTAREA><BR>';
	
	document.getElementById('outputblock').innerHTML=s;		
}


function setup_code_pairs() {
	var even_letters = []
	var odd_letters = []
	var str,state;
	var i,c,str,n;
	var digit_flag = 0;
	var alpha_flag = 0;
	
	data = document.ciphertext.cipher_place.value;
	data = data.toUpperCase();
	// check to see if it's a digital checkerboard
	for (i=0;i<data.length;i++){
		c = data.charAt(i);
		if ( letters.indexOf(c) >-1 && letters.indexOf(c) < 26) alpha_flag = 1;
		else if ( digits.indexOf(c) != -1) digit_flag = 1;
	}
	if ( digit_flag == 1 && alpha_flag == 1){
		alert("Code has both digits and letters! Try 6x6 checkerboard solver!");
		return;
	}
	if ( digit_flag == 1){
		str = '';
		for (i=0;i<data.length;i++){
			c = data.charAt(i);
			n = digits.indexOf(c);
			if ( n != -1) 
				str += letters.charAt(n);
		}
		alert("Digits converted to letters.");
		data = str;
	}
	state=0;
	code = '';
	for (i=0;i<data.length;i++) {
		c = data.charAt(i);
		if ( letters.indexOf(c) >-1 && letters.indexOf(c) < 26) {
			if (state==0) {
				code = code+c;
				state=1;
				if (even_letters.indexOf(c) == -1)
					even_letters.push(c);
			}
			else {
				code = code+c+' ';
				state=0;
				if (odd_letters.indexOf(c) == -1)
					odd_letters.push(c);
			}
		}
	}
	solving_flag=1;
	if (state) {
		alert("Cipher has odd number of letters!");
		solving_flag=0;
		return;
	}
	//str = 'there were '+even_letters.length+' evens and '+odd_letters.length+' odds'
	//alert(str);
	if ( even_letters.length>10 || odd_letters.length >10){
		str = 'Two many letters! There are '+even_letters.length+' evens and '+odd_letters.length+' odds'
		alert(str);
		solving_flag=0;
		return;
	}
	if (even_letters.length > 5 || odd_letters.length > 5)
		double_ck_flag = 1;
	else double_ck_flag = 0;
	code_array = code.split(' ');
	if (double_ck_flag == 0)
		fill_border_letters(even_letters, odd_letters);
}

function border_is_blank(outer_key, inner_key) {
	var i;
	for (i=0;i<asize;i++) {
		if (outer_key[digits.charAt(i)] != '-' || inner_key[digits.charAt(i)] != '-')
			return(false);
	}
	return(true);
}

// Only fills a side the solver hasn't started labelling, so their own labels are never overwritten.
function fill_border_letters(row_letters, column_letters) {
	var i;
	if (border_is_blank(left_outer_key, left_inner_key)) {
		row_letters.sort();
		for (i=0;i<row_letters.length;i++)
			left_outer_key[digits.charAt(i)] = row_letters[i];
	}
	if (border_is_blank(top_outer_key, top_inner_key)) {
		column_letters.sort();
		for (i=0;i<column_letters.length;i++)
			top_outer_key[digits.charAt(i)] = column_letters[i];
	}
	restore_keyblock();
}

function key_lookup(c) { // see if letter pair c is represented in the keysquare
	var c1,p1,c2,p2,pr;
	
	c1 = c.charAt(0);	
	if ( left_outer_key.indexOf(c1) >-1) {
		p1 = digits.charAt(left_outer_key.indexOf(c1));
	}
	else if ( left_inner_key.indexOf(c1) >-1) {
		p1 = digits.charAt(left_inner_key.indexOf(c1));
	}
	else return(['-','55']);
	c2 = c.charAt(1);
	if ( top_outer_key.indexOf(c2) >-1) {
		p2 = digits.charAt(top_outer_key.indexOf(c2));
	}
	else if ( top_inner_key.indexOf(c2) >-1) {
		p2 = digits.charAt(top_inner_key.indexOf(c2));
	}
	else return(['-','55']); // note: '55' is outside the key square so no plaintext will turn to red.
	pr = p1+p2;
	//return the key entry (letter or -) and the string digit pair representing its coordinates in the key
	return ([check_key[pr],pr]);
}



function xlate() {
	var state,str,limit,pos,pl,cnt,numb_pairs;
	if (solving_flag ==0) {
		setup_code_pairs();
		if (solving_flag==0) return;//odd number of letters!
	}
	str='';
	//str='<style="font-family:monospace; font-size:15px;">';
	limit=pair_line_limit;
	numb_pairs=code_array.length-1;//final entry not a code pair
	if (numb_pairs<limit)
		limit = numb_pairs;
	pos=0;
	cnt=0;
	pl='';
	while (pos<numb_pairs ) {
		if ( crib_entered==1 && pos>= crib_pos && pos < crib_pos+cribtext.length)  {
			str = str+'<font color="red">'+code_array[pos]+' </font>';
			pl += cribtext.charAt(pos-crib_pos)+'&nbsp;&nbsp;';
		}
		else { str = str+code_array[pos]+' ';
			//pl = pl+check_key[code_array[pos]]+'  ';
			ce=code_array[pos];
			c = key_lookup(ce);
			ce = c[1]
			c = c[0]
			if ( ce==last_cell)
				c = '<font color="red">'+c+'</font>';
			pl += '<span id="pt'+pos+'" onclick="select_plaintext('+pos+')" style="cursor:pointer">'+c+'</span>&nbsp;&nbsp;';
		}
		pos++;
		cnt++;
		if (cnt>=limit) {
			//str=str+'\n'+pl+'\n';
			str = str+'<br><font color="blue">'+pl+'</font><br>'
			pl='';
			cnt=0;
			if (pos+pair_line_limit>numb_pairs)
				limit = numb_pairs-pos;;
		}
	}
	if (crib_entered != 1) hide_repeats();
	document.getElementById('outputblock').innerHTML=str;
	selected_plaintext_pos = -1;
}

// The key cell is highlighted on its bordered box, which is the span around the cell's text
function key_cell_box(cell) {
	return(document.getElementById(cell+'keymatrix').parentElement);
}

function clear_selection() {
	if (selected_plaintext_pos != -1)
		document.getElementById('pt'+selected_plaintext_pos).style.background = '';
	if (selected_key_cell != '')
		key_cell_box(selected_key_cell).style.background = 'white';
	if (selected_border_id != '')
		document.getElementById(selected_border_id).parentElement.style.background = 'silver';
	selected_plaintext_pos = -1;
	selected_key_cell = '';
	selected_border_id = '';
}

function select_plaintext(pos) {
	clear_selection();
	selected_plaintext_pos = pos;
	document.getElementById('pt'+pos).style.background = 'yellow';
}

function select_key_cell(cell) {
	clear_selection();
	selected_key_cell = cell;
	key_cell_box(cell).style.background = 'yellow';
}

function select_border(id) {
	clear_selection();
	selected_border_id = id;
	document.getElementById(id).parentElement.style.background = 'yellow';
}

// Updates the table in place so the swap controls, if showing, are left alone
function refresh_key_table() {
	var i,j,cell,suffix;
	for (i=0;i<asize;i++) for (j=0;j<asize;j++) {
		cell = digits.charAt(i)+digits.charAt(j);
		document.getElementById(cell+'keymatrix').textContent = check_key[cell];
	}
	for (i=0;i<asize;i++) for (suffix in border_keys)
		document.getElementById(digits.charAt(i)+suffix).textContent = border_keys[suffix][digits.charAt(i)];
}

function type_letter(e) {
	var letter,cell,target;
	e = e || window.event;
	if ((selected_plaintext_pos == -1 && selected_key_cell == '' && selected_border_id == '') || e.ctrlKey || e.altKey || e.metaKey)
		return;
	if (e.key == 'Escape') {
		clear_selection();
		return false;
	}
	letter = (e.key == 'Delete' || e.key == 'Backspace' || e.key == ' ') ? '-' : e.key.toLowerCase();
	if (letter.length != 1 || symbols.indexOf(letter) == -1)
		return;
	if (selected_border_id != '') {
		border_keys[selected_border_id.slice(1)][selected_border_id.charAt(0)] = letter.toUpperCase();
		clear_selection();
		refresh_key_table();
		xlate();
		return false;
	}
	if (selected_key_cell != '') {
		cell = selected_key_cell;
		target = 'the selected cell';
	}
	else {
		target = code_array[selected_plaintext_pos];
		cell = key_lookup(target)[1];
		if (cell == '55' && letter == '-') {
			clear_selection();
			return false;
		}
		if (cell == '55') {
			alert('Cannot enter a letter under '+target+': its row or column letter is missing from the table.');
			return false;
		}
	}
	if (letter != '-' && check_key[cell] != letter && key_contains(letter)) {
		if (!confirm("'"+letter+"' is already in the key table. Move it to "+target+"?"))
			return false;
	}
	clear_selection();
	erase_from_key(letter);
	check_key[cell] = letter;
	crib_entered = 0;
	last_cell = cell;
	refresh_key_table();
	xlate();
	return false;
}
document.onkeydown = type_letter;


function selectmouse(e)
{
  var fobj       = fire_fox ? e.target : event.srcElement;
  if (fobj.className.slice(2)=="keyblock") {
	  select_key_cell(fobj.className.slice(0,2));

  }

	  select_border(fobj.id);

	  dobj = fobj;
	  cell=dobj.className.slice(0,1);

	  if (columns_selected[ cell]==1) {
	  	s= '<span width="75" height = "75" id ="'+dobj.id+'" class="'+dobj.className+'" style="color:black">';
	  	s +='X</span>';
	   }
	  else {	   
	  	s= '<span width="75" height = "75" id ="'+dobj.id+'" class="'+dobj.className+'" style="color:Yellow">';
	  	s +='&nbsp</span>';
	   }		  
	  document.getElementById(dobj.id).innerHTML= s;	
      //next 3 lines for debugging
	  //s = "you put it under letter "+cell+"\n";
	  //s = s+check_key;
	  //document.debug.output_area.value= s; 	
      return false;	  
  }
  else if (fobj.className.slice(1)=="keyrow") {	  
	  dobj = fobj;
	  cell=dobj.className.slice(0,1);
	  //update rows selected array
	  rows_selected[ cell] ^= 1;
	  if (rows_selected[ cell]==1) {
	  	s= '<span width="75" height = "75" id ="'+dobj.id+'" class="'+dobj.className+'" style="color:black">';
	  	s +='X</span>';
	   }
	  else {	   
	  	s= '<span width="75" height = "75" id ="'+dobj.id+'" class="'+dobj.className+'" style="color:Yellow">';
	  	s +='&nbsp</span>';
	   }		  
	  document.getElementById(dobj.id).innerHTML= s;		  
      //next 3 lines for debugging
	  //s = "you put it under letter "+cell+"\n";
	  //s = s+check_key;
	  //document.debug.output_area.value= s; 	
      return false;	  
  }
	  
}
document.onmousedown=selectmouse;

function keyblock_setup() {
	var s,i,c;
	
	s='';
	//two columns of blank place holders
	s = s+'<span width="75" height="75" style="border: 2px solid silver;background: silver;"  >';
	s=s+'&nbsp&nbsp<span width="75" height = "75" >';
	s=s+'</span> </span>';
	s = s+'<span width="75" height="75" style="border: 2px solid silver;background: silver;"  >';
	s=s+'&nbsp&nbsp<span width="75" height = "75" >';
	s=s+'</span> </span>';

	//dashes across the top
	for (i=0;i<5;i++) {
		c = digits.charAt(i);
			s = s+'<span width="75" height="75" style="border: 2px solid silver;background: silver;"  >';
			s=s+'&nbsp<span width="75" height = "75" id ="'+c+'key_top_outer" class="'+c+'keytopouter" style="color:blue">';			
			s=s+'-</span> </span>';
	}		
	//two columns of blank place holders
	s = s +'&nbsp;<br>';
	s = s+'<span width="75" height="75" style="border: 2px solid silver;background: silver;"  >';
	s=s+'&nbsp&nbsp<span width="75" height = "75" >';
	s=s+'</span> </span>';
	s = s+'<span width="75" height="75" style="border: 2px solid silver;background: silver;"  >';
	s=s+'&nbsp&nbsp<span width="75" height = "75" >';
	s=s+'</span> </span>';
	//second row dashes across the top
	for (i=0;i<5;i++) {
		c = digits.charAt(i);
			s = s+'<span width="75" height="75" style="border: 2px solid silver;background: silver;"  >';
			s=s+'&nbsp<span width="75" height = "75" id ="'+c+'key_top_inner" class="'+c+'keytopinner" style="color:blue">';						
			s=s+'-</span> </span>';
	}		
	s=s+'&nbsp;<br>';
	
	for (i=0;i<5;i++) {
		cr = digits.charAt(i);
			//left outer
			s = s+'<span width="75" height="75" style="border: 2px solid silver;background: silver;"  >';
			s=s+'&nbsp<span width="75" height = "75" id ="'+cr+'key_left_outer" class="'+cr+'keyleftouter" style="color:blue">';			
			s=s+'-</span> </span>';
			// left inner 
			s = s+'<span width="75" height="75" style="border: 2px solid silver;background: silver;"  >';
			s=s+'&nbsp<span width="75" height = "75" id ="'+cr+'key_left_inner" class="'+cr+'keyleftinner" style="color:blue">';			
			s=s+'-</span> </span>';
		//row of key block cells
		for (j=0;j<5;j++) {
			cc=digits.charAt(j);
			c = cr+cc;
			s = s+'<span width="75" height="75" style="border: 2px solid black;background: white;"  >';
			s=s+'&nbsp<span width="75" height = "75" id ="'+c+'keymatrix" class="'+c+'keyblock" style="color:blue">';
			s=s+'-'+'</span> </span>';
		}
		s=s+'&nbsp;<br>';	
	}	
	s=s+'&nbsp;<br>';	
	document.getElementById('keyblock').innerHTML=s;	
	selected_key_cell = '';
	selected_border_id = '';

}

function start_over() {
	if (solving_flag==0) {
		code = document.ciphertext.cipher_place.value;
	}
	reset_key();
	last_cell='';
	keyblock_setup()
	input_ok();
	document.ciphertext.cipher_place.value=code;
	solving_flag=0;
}	

function reset() {
	do_erase = confirm("Erase the current cipher?")
	if ( do_erase == true) {
		reset_key();
		last_cell='';
		keyblock_setup()
		input_ok();
		hide_repeats();
		document.ciphertext.cipher_place.value='';
		data='';
		solving_flag=0;
		crib_entered=0;
	}	
}	



function redirect() {
	window.location="checkerboard_lowres.html";
}

function screen_check() {
	if (screen.width <1000) {
		redirect();
	}
}

function restore_keyblock(flag) { // if flag ==1 include yellow selection boxes
	var s,i,c;
	
	s='';
	//two columns of blank place holders
	s = s+'<span width="75" height="75" style="border: 2px solid silver;background: silver;"  >';

	s=s+'</span> </span>';

	//top outer key across the top
	for (i=0;i<5;i++) {
		c = digits.charAt(i);
		v = top_outer_key[c];
			s = s+'<span width="75" height="75" style="border: 2px solid silver;background: silver;"  >';
			s=s+'&nbsp<span width="75" height = "75" id ="'+c+'key_top_outer" class="'+c+'keytopouter" style="color:blue">';			
			s += v+'</span> </span>';
	}		
	//two columns of blank place holders
	s = s +'&nbsp;<br>';

	s=s+'&nbsp&nbsp<span width="75" height = "75" >';
	s=s+'</span> </span>';
	s = s+'<span width="75" height="75" style="border: 2px solid silver;background: silver;"  >';
	s=s+'&nbsp&nbsp<span width="75" height = "75" >';
	s=s+'</span> </span>';
	//top inner key across the top
	for (i=0;i<5;i++) {
		c = digits.charAt(i);
		v = top_inner_key[c];
			s = s+'<span width="75" height="75" style="border: 2px solid silver;background: silver;"  >';
			s=s+'&nbsp<span width="75" height = "75" id ="'+c+'key_top_inner" class="'+c+'keytopinner" style="color:blue">';						
			s += v+'</span> </span>';
	}		
	s=s+'&nbsp;<br>';
	
	for (i=0;i<5;i++) {
		cr = digits.charAt(i);
			//left outer
			v = left_outer_key[cr];
			s = s+'<span width="75" height="75" style="border: 2px solid silver;background: silver;"  >';
			s=s+'&nbsp<span width="75" height = "75" id ="'+cr+'key_left_outer" class="'+cr+'keyleftouter" style="color:blue">';			
			s += v+'</span> </span>';
			// left inner 
			v = left_inner_key[cr];
			s = s+'<span width="75" height="75" style="border: 2px solid silver;background: silver;"  >';
			s=s+'&nbsp<span width="75" height = "75" id ="'+cr+'key_left_inner" class="'+cr+'keyleftinner" style="color:blue">';			
			s += v+'</span> </span>';
		//row of key block cells
		for (j=0;j<5;j++) {
			cc=digits.charAt(j);
			c = cr+cc;
			v = check_key[c];
			s = s+'<span width="75" height="75" style="border: 2px solid black;background: white;"  >';
			s=s+'&nbsp<span width="75" height = "75" id ="'+c+'keymatrix" class="'+c+'keyblock" style="color:blue">';
			s += v+'</span> </span>';
		}
		if (flag) {// yellow row selection box
			s = s+'<span width="75" height="75" style="border: 2px solid black;background: yellow;"  >';
			s=s+'&nbsp<span width="75" height = "75" id ="'+cr+'key_row" class="'+cr+'keyrow" style="color:yellow">';
			s += '&nbsp</span> </span>';
			rows_selected[cr]=0;
		}
		
		s=s+'&nbsp;<br>';	
	}	
	if (flag) {//put in yellow column boxes
	//two columns of blank place holders
		s = s+'<span width="75" height="75" style="border: 2px solid silver;background: silver;"  >';
		s=s+'&nbsp&nbsp<span width="75" height = "75" >';
		s=s+'</span> </span>';
		s = s+'<span width="75" height="75" style="border: 2px solid silver;background: silver;"  >';
		s=s+'&nbsp&nbsp<span width="75" height = "75" >';
		s=s+'</span> </span>';
	
		// yellow selection boxes
		for (i=0;i<5;i++) {
					c = digits.charAt(i);
				s = s+'<span width="75" height="75" style="border: 2px solid black;background: yellow;"  >';
				s=s+'&nbsp<span width="75" height = "75" id ="'+c+'key_column" class="'+c+'keycolumn" style="color:yellow">';			
				s += '&nbsp</span> </span>';
				columns_selected[c] = 0;
		}		
	} // end if flag
	s=s+'&nbsp;<br>';	
	document.getElementById('keyblock').innerHTML=s;	
	selected_key_cell = '';
	selected_border_id = '';

}
	


function set_original_buttons() {
	var str;
	str = '<div style="display:flex; flex-direction:column; justify-content:space-between; height:100%;">';
	str += '<div><INPUT onclick=update_table(); type=button value="Update table" data-tip="Write the letters of the placed crib into the key table, and fill in blank row and column letters" >';
	str += '<span id="crib_actions" style="position:relative; margin-left:45px;"></span></div>';
	str += '<div><INPUT onclick=start_over(); type=button value="Start over" data-tip="Clear the key table and its row and column letters, keeping the ciphertext so it can be edited" >';
	str += '<INPUT onclick=clear_plaintext(); type=button value="Clear plaintext" data-tip="Clear the letters inside the key table, keeping the row and column letters" >';
	str += '<INPUT onclick=reset(); type=button value="Erase cipher" data-tip="Erase the ciphertext and the key table to start a new cipher" ></div>';
	str += '<div><INPUT onclick=setup_swap(); type=button value="Swap rows or columns in key" data-tip="Exchange two rows or two columns of the key table, together with their row or column letters" ></div>';
	str += '</div>';
	document.getElementById('button_actions').innerHTML= str;
	set_crib_buttons();
}

function erase_from_key(letter) {
	var i,j,cell;
	for (i=0;i<asize;i++) for (j=0;j<asize;j++) {
		cell = digits.charAt(i)+digits.charAt(j);
		if (check_key[cell] == letter)
			check_key[cell] = '-';
	}
}

function distinct_coordinates(index) { // index 0 gives the row letters, 1 the column letters
	var found = [];
	var i,c;
	for (i=0;i<code_array.length-1;i++) {
		c = code_array[i].charAt(index);
		if (found.indexOf(c) == -1)
			found.push(c);
	}
	return(found);
}

function update_table() {
	var unplaced = [];
	if (solving_flag == 0) {
		if (document.ciphertext.cipher_place.value.trim() == '')
			return;
		setup_code_pairs(); // also fills the border letters
		if (solving_flag == 0)
			return;
	}
	else if (double_ck_flag == 0)
		fill_border_letters(distinct_coordinates(0), distinct_coordinates(1));
	if (crib_entered == 1)
		unplaced = enter_crib_into_key();
	restore_keyblock();
	xlate();
	if (unplaced.length > 0)
		alert('Not entered, their row or column letter is missing from the table: '+unplaced.join(' '));
}

function enter_crib_into_key() {
	var i,c,pr,cell;
	var unplaced = [];
	for (i=0;i<cribtext.length;i++) {
		c = cribtext.charAt(i);
		if (c == '-')
			continue;
		pr = code_array[crib_pos+i];
		cell = key_lookup(pr)[1];
		if (cell == '55') {
			if (unplaced.indexOf(pr) == -1)
				unplaced.push(pr);
			continue;
		}
		erase_from_key(c);
		check_key[cell] = c;
	}
	crib_entered = 0;
	return(unplaced);
}

function show_repeats() {
	var repeats = document.getElementById('crib_repeats');
	repeats.innerHTML = '<font color="blue">There are '+numb_repeats+' repeated pairs at this crib position.</font>';
	repeats.style.visibility = 'visible';
}

function hide_repeats() {
	var repeats = document.getElementById('crib_repeats');
	if (repeats) // absent while the swap controls replace the buttons
		repeats.style.visibility = 'hidden';
}


function key_contains(letter) {
	var i,j;
	for (i=0;i<asize;i++) for (j=0;j<asize;j++) {
		if (check_key[digits.charAt(i)+digits.charAt(j)] == letter)
			return(true);
	}
	return(false);
}

// A pair whose row or column letter isn't in the table yet can't be checked against it.
function conflicts_with_key(pr, c) {
	var cell = key_lookup(pr)[1];
	if (c == '-' || cell == '55')
		return(false);
	if (check_key[cell] != '-')
		return(check_key[cell] != c);
	return(key_contains(c));
}

function ck_crib_pos() {
	//reset_key();
	var cipher_letters = {}; // can use dictionaries in javascript much like python
	var reverse_even_letters = {};
	var reverse_odd_letters = {};
	var c,r,i,pr;
	numb_repeats=0;
	for (i=0;i<cribtext.length;i++) {
		c = cribtext.charAt(i);
		pr =code_array[crib_pos+i];
		if (conflicts_with_key(pr, c)) return(0);
		if (pr in cipher_letters && cipher_letters[pr] != c) return(0); // inconsistent here
		if (pr in cipher_letters) numb_repeats++;
		else cipher_letters[pr] = c;
		r = pr.charAt(0);
		if (c in reverse_even_letters && reverse_even_letters[c].indexOf(r) == -1)
			reverse_even_letters[c].push(r);
		else if ( !(c in reverse_even_letters)) reverse_even_letters[c] = [r];
		r = pr.charAt(1);
		if (c in reverse_odd_letters && reverse_odd_letters[c].indexOf(r) == -1)
			reverse_odd_letters[c].push(r);
		else if ( !(c in reverse_odd_letters)) reverse_odd_letters[c] = [r];
	}
	for (c in reverse_even_letters){
		if (double_ck_flag == 0 && reverse_even_letters[c].length>1) return(0); 
		if (reverse_even_letters[c].length>2) return(0); 
	}
	for (c in reverse_odd_letters){
		if (double_ck_flag == 0 && reverse_odd_letters[c].length>1) return(0); 
		if (reverse_odd_letters[c].length>2) return(0); 
	}
	
	//it seems consistent, 
	//keyblock_setup();
	/*
	restore_keyblock();	
	for (i=0;i<cribtext.length;i++) {
		c = cribtext.charAt(i);
		pr =code_array[crib_pos+i];
        s= '<span width="75" height = "75" id ="'+pr+'keymatrix" class="'+pr+'keyblock" style="color:blue">';
	    s=s+c+'</span>';
	    document.getElementById(pr+'keymatrix').innerHTML= s;
	}
	*/
	return(1); //OK at crib_pos!
}	

function drag_right() {
	if (crib_entered==0) {
		enter_crib();
		return;
	}
	drag_crib(1);
}

function drag_left(){
	if (crib_entered==0) {
		enter_crib();
		return;
	}
	drag_crib(-1);
}

// Searches round the whole cipher, so dragging past either end wraps to the next match.
function drag_crib(step) {
	var positions = code_array.length-cribtext.length;
	var tries;
	for (tries=0;tries<positions;tries++) {
		crib_pos = (crib_pos+step+positions)%positions;
		if ( ck_crib_pos() ) {
			show_repeats();
			crib_entered=1; // show cipher letters in red
			xlate();
			return;
		}
	}
	crib_entered=2; // don't show any red letters
	xlate();
}


function enter_crib(){
	var crib= prompt('Enter crib');
	if (crib==' ' || crib==null)
		return;
	if (solving_flag ==0) {
		setup_code_pairs();
		if (solving_flag==0) return;//odd number of digits!
	}
	cribtext='';
	crib = crib.toLowerCase();	
	for (i=0;i<crib.length;i++) {
		c = crib.charAt(i);
		if (symbols.indexOf(c) !=-1 ) {//allow '-' chars in crib!
			cribtext = cribtext+c;
		}
	}
	crib_pos=0;
	not_found=1;
	while(crib_pos< code_array.length-cribtext.length) {
		if ( ck_crib_pos() ) {
			not_found=0;
			break; // OK!
		}
		crib_pos++;
	}
	if ( not_found ){
		crib_entered=2; // don't show any red letters		
		xlate();
		return;
	}
	else {
		show_repeats();
    }
	//fill in plaintext
	crib_entered=1; // show cipher letters in red
	xlate();
	// wait until letter entered into key matrix (not boundary) before restoring normal color

}

function set_crib_buttons() {
	var str;
	str = '<INPUT onclick=enter_crib(); type=button value="Enter crib" data-tip="Enter a probable word; it is placed at the first position that does not conflict with the key table" >';
	str += '<INPUT onclick=drag_left(); type=button value="Drag left" data-tip="Move the crib to the previous position that fits" >';	
	str += '<INPUT onclick=drag_right(); type=button value="Drag right" data-tip="Move the crib to the next position that fits" >';	
	// positioned under the crib buttons so showing it doesn't push the button lines apart
	str += '<span id="crib_repeats" style="visibility:hidden; position:absolute; left:0; top:100%; margin-top:4px; white-space:nowrap;"></span>';
	document.getElementById('crib_actions').innerHTML= str;		
}

function restore_original() {
	set_original_buttons();
	restore_keyblock(0);
}

function do_swap() {
	var i,ccnt,rcnt, col1,col2,row1,row2,s,n,p;
	
	ccnt = rcnt=0
	for (i=0;i<5;i++) {
		c = digits.charAt(i);
		if (columns_selected[c]==1) {
			if (ccnt==0) col1=c;
			else if ( ccnt ==1 )col2=c;
			ccnt += 1;
		}
		if (rows_selected[c]==1) {
			if (rcnt==0) row1=c;
			else if ( rcnt ==1 )row2=c;
			rcnt += 1;
		}
	}
	if (ccnt+rcnt>2) {
			alert("Too many rows/columns selected!")
			return
	}
	if (ccnt>0 && rcnt>0){		
			alert("Select only rows or only columns!")
			return
	}
	if (ccnt+rcnt<2) {
			alert("Select a PAIR of rows or a PAIR of columns!")
			return
	}	
	if ( ccnt ==2) { //swap columns col1 and col2
		// swap top keys
		s = top_outer_key[col1];
		top_outer_key[col1]= top_outer_key[col2];
		top_outer_key[col2] = s
		s = top_inner_key[col1];
		top_inner_key[col1]= top_inner_key[col2];
		top_inner_key[col2] = s
		// swap columns in keysquare
		for (i=0;i<5;i++) {
			n = digits.charAt(i);
			s = check_key[n+col1];
			check_key[n+col1] = check_key[n+col2];
			check_key[n+col2]=s;
		}
	}
	if ( rcnt ==2) { //swap rows row1 and row2
		// swap left keys
		s = left_outer_key[row1];
		left_outer_key[row1]= left_outer_key[row2];
		left_outer_key[row2] = s
		s = left_inner_key[row1];
		left_inner_key[row1]= left_inner_key[row2];
		left_inner_key[row2] = s
		// swap rows in keysquare
		for (i=0;i<5;i++) {
			n = digits.charAt(i);
			s = check_key[row1+n];
			check_key[row1+n] = check_key[row2+n];
			check_key[row2+n]=s;
		}
	}	
	restore_original();
}

function setup_swap() {
	str='Select a pair of rows or columns by clicking their yellow boxes. <br>';
	str += 'Then click the swap button. <br>';
	str += '<br><input type="button" value="Swap" onclick=do_swap()>';		
	str += '&nbsp&nbsp<input type="button" value="Cancel" onclick=restore_original()>';	
	document.getElementById('button_actions').innerHTML= str;
	restore_keyblock(1);	
}

function save_to_disk(){
	var i,j, str;
	
	if (typeof(localStorage) == 'undefined' ) {
		alert('Your browser does not support HTML5 localStorage. Try Chrome.');
		return;
	}
	if (!data) {
		alert('No cipher to save. Enter a cipher and start solving first.');
		return;
	}
	try {
		localStorage.setItem("checkerboard.cipher", data);
		str = '';
		for (i=0;i<asize;i++) for (j=0;j<asize;j++) {
			str +=check_key[ digits.charAt(i)+digits.charAt(j) ];
		}
		localStorage.setItem("checkerboard.key", str);
		str = '';
		for (i=0;i<asize;i++) {
			str += left_outer_key[digits.charAt(i)];
			str += left_inner_key[digits.charAt(i)];
			str += top_outer_key[digits.charAt(i)];
			str += top_inner_key[digits.charAt(i)];
		}
		localStorage.setItem("checkerboard.outer_keys", str);
	} catch (e) {
		alert('Work not saved: '+e.message);
		return;
	}
	alert("Work saved on disk");

}

function get_from_disk(){
	var s,i,j,k;

	data = localStorage.getItem("checkerboard.cipher");
	// older versions could save the literal string "undefined" before any cipher was entered
	if (data == null || data == 'undefined'){
		alert("No cipher stored");
		return
	}
	reset_key();
	last_cell='';
	keyblock_setup();
	set_original_buttons();
	input_ok();
	document.ciphertext.cipher_place.value=data;
	solving_flag=0;
	crib_entered=0;
	pair_setup=0;
	start_over();
	xlate();
	s = localStorage.getItem("checkerboard.key");
	k=0;
	for (i=0;i<asize;i++) for (j=0;j<asize;j++) {
		check_key[ digits.charAt(i)+digits.charAt(j) ]= s.charAt(k);
		k++;
	}
	
	s = localStorage.getItem("checkerboard.outer_keys");	
	k=0;
	for (i=0;i<asize;i++) {
		left_outer_key[digits.charAt(i)]= s.charAt(k++);
		left_inner_key[digits.charAt(i)]= s.charAt(k++);
		top_outer_key[digits.charAt(i)]= s.charAt(k++);
		top_inner_key[digits.charAt(i)]= s.charAt(k++);
	}
	restore_keyblock();
	xlate();
}

var tooltip_timer;

// a delay keeps tooltips from flashing up as the cursor passes over the buttons
function schedule_tooltip(e) {
	var button = e.target;
	var tip = button.getAttribute('data-tip');
	hide_tooltip();
	if (!tip) return;
	tooltip_timer = setTimeout(function() {
		var tooltip = document.getElementById('tooltip');
		var box = button.getBoundingClientRect();
		tooltip.textContent = tip;
		tooltip.style.left = (box.left + window.scrollX) + 'px';
		tooltip.style.top = (box.bottom + window.scrollY + 6) + 'px';
		tooltip.style.visibility = 'visible';
	}, 800);
}

function hide_tooltip() {
	clearTimeout(tooltip_timer);
	document.getElementById('tooltip').style.visibility = 'hidden';
}

document.addEventListener('mouseover', schedule_tooltip);
document.addEventListener('mousedown', hide_tooltip);

function clear_disk(){
	localStorage.removeItem("checkerboard.cipher");
	localStorage.removeItem("checkerboard.key");	
	localStorage.removeItem("checkerboard.outer_keys");		
	alert("work cleared from disk");
}

function read_cipher() {
	if (solving_flag == 1)
		return true;
	if (document.ciphertext.cipher_place.value.trim() == '') {
		alert('No cipher entered.');
		return false;
	}
	setup_code_pairs();
	if (solving_flag == 0)
		return false;
	restore_keyblock();
	xlate();
	return true;
}

function show_popup(text) {
	document.getElementById('popup_text').textContent = text;
	document.getElementById('popup').style.display = 'flex';
}

function close_popup() {
	document.getElementById('popup').style.display = 'none';
}

function show_coordinate_symbols() {
	if (!read_cipher())
		return;
	show_popup('Row: '+distinct_coordinates(0).sort().join('')+'\nColumn: '+distinct_coordinates(1).sort().join(''));
}

function show_frequency_count() {
	var counts = {};
	var i,pair,pairs,width,plaintext,lines;
	if (!read_cipher())
		return;
	for (i=0;i<code_array.length-1;i++)
		counts[code_array[i]] = (counts[code_array[i]] || 0) + 1;
	pairs = Object.keys(counts).sort(function(a, b) { return counts[b]-counts[a] || (a < b ? -1 : 1); });
	width = String(counts[pairs[0]]).length;
	lines = [];
	for (i=0;i<pairs.length;i++) {
		pair = pairs[i];
		plaintext = key_lookup(pair)[0];
		lines.push(pair+'  '+String(counts[pair]).padStart(width)+(plaintext == '-' ? '' : ' ('+plaintext+')'));
	}
	show_popup(lines.join('\n'));
}
