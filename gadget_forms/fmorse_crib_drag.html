<head>

<title>Fract. Morse crib drag</title>
<script type="text/javascript">
var symbols = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
var crib_symbols = 'abcdefghijklmnopqrstuvwxyz ';
var code = [];
var crib = [];
var mcode_crib;
var mcode_starts;

var flag_6x6 = false;
var numb_symbols;
var keysquare_width;

var crib_len;
var used_let = [];

var EMPTY = -1;
//var END_SYMBOL = 2;
var ERROR_SYMBOL = '^';
var free_index, start0,start1;
var morse = [];
var code_len, plain_len;
var crib_pattern;

var morse_dict = { 'e':['.'],
		't':['-'],
		'i':['.','.'],
		'a':['.','-'],
		'n':['-','.'],
		'm':['-','-'],
		's':['.','.','.'],
		'u':['.','.','-'],
		'r':['.','-','.'],
		'w':['.','-','-'],
		'd':['-','.','.'],

		'h':['.','.','.','.'],
		'v':['.','.','.','-'],
		'f':['.','.','-','.'],
		'l':['.','-','.','.'],
		'p':['.','-','-','.'],
		'j':['.','-','-','-'],
		'b':['-','.','.','.'],
		'x':['-','.','.','-'],
		'c':['-','.','-','.'],

		'7':['-','-','.','.','.'],

		'/':['-','.','.','-','.'],

};

var END_SYMBOL = 'x'

var morse_order = ['...','..-','..x','.-.','.--','.-x','.x.','.x-','.xx',
'-..','-.-','-.x','--.','---','--x','-x.','-x-','-xx',
'x..','x.-','x.x','x-.','x--','x-x','xx.','xx-'];


function print_output() {
    var text = document.getElementById('output_area').value;
    var w = window.open('', '_blank');
    w.document.write('<pre>' + text.replace(/&/g,'&amp;').replace(/</g,'&lt;') + '</pre>');
    w.document.close();
    w.print();
}

function format_crib_match(crib_pos, eff, first_pos) {
    var i, li, s, k, abs_pos, body_col, disp_col, p, w, eff_start;
    var SEP = '-------------------------------------------------------------\n';
    var HSEP = '=============================================================\n';
    var LW  = 61;
    var out = HSEP + 'Position ' + crib_pos + ' OK\n' + HSEP + '\n';

    var lead_offset = eff.length - mcode_crib.length;

    // PT letter positions: eff index of each crib letter's first Morse segment
    var pt_info = [];
    for (i = 0; i < crib_len; i++) {
        var c = crib_symbols.charAt(crib[i]);
        if (c != ' ') {
            pt_info.push({ch: c, eff_idx: lead_offset + mcode_starts[i]});
        }
    }

    // Map an eff index to cipher letter index k (relative to crib_pos)
    function eff_to_k(m) {
        if (first_pos == 0) return Math.floor(m / 3);
        if (first_pos == 1) return m >= 2 ? Math.floor((m - 2) / 3) : -1;
        return m >= 1 ? Math.floor((m - 1) / 3) : -1;
    }

    for (var row_start = 0; row_start < code.length; row_start += 25) {
        var row_end = Math.min(row_start + 25, code.length);

        // CT line
        s = 'CT: ';
        for (i = row_start; i < row_end; i++) {
            li = i - row_start;
            if (li > 0) s += (li % 5 == 0) ? '   ' : ' ';
            s += symbols.charAt(code[i]);
        }
        out += s + '\n';

        // Build Morse rows and PT rows as char arrays
        var ml = [[], [], []];
        var pl = [[], []];
        for (w = 0; w < LW; w++) {
            ml[0].push(' '); ml[1].push(' '); ml[2].push(' ');
            pl[0].push(' '); pl[1].push(' ');
        }
        pl[0][0]='P'; pl[0][1]='T'; pl[0][2]=':';

        // Partial leading segments for first_pos > 0 (incomplete preceding triplet)
        if (first_pos > 0) {
            var prev_abs = crib_pos - 1;
            if (prev_abs >= row_start && prev_abs < row_end) {
                var prev_li = prev_abs - row_start;
                var prev_dc = 4 + Math.floor(prev_li / 5) * 12 + (prev_li % 5) * 2;
                if (prev_dc < LW) {
                    if (first_pos == 1) {
                        ml[1][prev_dc] = eff[0];
                        ml[2][prev_dc] = eff[1];
                    } else {
                        ml[2][prev_dc] = eff[0];
                    }
                }
            }
        }

        // Fill Morse segments
        for (k = 0; k < crib_pattern.length; k++) {
            abs_pos = crib_pos + k;
            if (abs_pos < row_start || abs_pos >= row_end) continue;
            li = abs_pos - row_start;
            body_col = Math.floor(li / 5) * 12 + (li % 5) * 2;
            disp_col = 4 + body_col;
            eff_start = (first_pos == 0) ? k*3 : (first_pos == 1) ? k*3+2 : k*3+1;
            for (p = 0; p < 3; p++) {
                if (eff_start+p < eff.length && disp_col < LW)
                    ml[p][disp_col] = eff[eff_start + p];
            }
        }

        // Partial trailing segments (eff elements after the last complete triplet)
        if (crib_pattern.length > 0) {
            var last_k = crib_pattern.length - 1;
            var last_eff_start = (first_pos == 0) ? last_k*3 : (first_pos == 1) ? last_k*3+2 : last_k*3+1;
            var trail_start = last_eff_start + 3;
            var next_abs = crib_pos + crib_pattern.length;
            if (trail_start < eff.length && next_abs >= row_start && next_abs < row_end) {
                var next_li = next_abs - row_start;
                var next_dc = 4 + Math.floor(next_li / 5) * 12 + (next_li % 5) * 2;
                for (p = 0; trail_start + p < eff.length && p < 3; p++) {
                    if (next_dc < LW) ml[p][next_dc] = eff[trail_start + p];
                }
            }
        }

        // Fill PT letters
        for (i = 0; i < pt_info.length; i++) {
            k = eff_to_k(pt_info[i].eff_idx);
            if (k < 0) {
                if (first_pos > 0) abs_pos = crib_pos - 1;
                else continue;
            } else {
                if (k >= crib_pattern.length) continue;
                abs_pos = crib_pos + k;
            }
            if (abs_pos < row_start || abs_pos >= row_end) continue;
            li = abs_pos - row_start;
            body_col = Math.floor(li / 5) * 12 + (li % 5) * 2;
            disp_col = 4 + body_col;
            if (disp_col < LW) {
                if (pl[0][disp_col] == ' ') pl[0][disp_col] = pt_info[i].ch;
                else                        pl[1][disp_col] = pt_info[i].ch;
            }
        }

        out += ml[0].join('').replace(/\s+$/, '') + '\n';
        out += ml[1].join('').replace(/\s+$/, '') + '\n';
        out += ml[2].join('').replace(/\s+$/, '') + '\n';
        out += pl[0].join('').replace(/\s+$/, '') + '\n';
        if (pl[1].join('').trim().length > 0) {
            out += pl[1].join('').replace(/\s+$/, '') + '\n';
        } else {
            out += '\n';
        }
        if (row_end < code.length) out += SEP;
    }
    return out;
}

function setup_code() {
	var i,j,state,cnt,c, data,n1,n;

  data = document.getElementById('input_area').value;
  data = data.toUpperCase();
  data = data.replace(/�/g,'0');
  if ( data == ''){
	alert("No cipher entered!");
	return(false);
  }
  cnt = 0;
  code = [];
	for (i=0;i<data.length;i++) {
		c = data.charAt(i);
		n = symbols.indexOf(c);
		if ( n >-1) {
		  code[cnt++]=n
		}
	}
	return(true);
}


function do_drag(){
var result,s,n,c,i,cnt,crib_pos,out_str,j,k,x,m_cnt,eff;
var alpha = 'abcdefghijklmnopqrstuvwxyz';


	result = setup_code(); // get code and convert to numbers
	if ( result == false)
		return;
	s = document.getElementById('crib').value;
	s = s.toLowerCase();
	if ( s==''){
		alert("No crib entered!");
		return;
	}
	crib = [];
    mcode_crib = [];
    mcode_starts = [];
	cnt = 0;
	m_cnt = 0;
	for (i=0;i<s.length;i++) {
		c = s.charAt(i);
		if (c == '|') {
		    mcode_crib[m_cnt++] = END_SYMBOL;
		    if (m_cnt == 1) mcode_crib[m_cnt++] = END_SYMBOL;
		} else {
		    n = crib_symbols.indexOf(c);
		    if (n > -1) {
		        crib[cnt++] = n;
		        if (c == ' ') {
		            mcode_starts.push(-1);
		            mcode_crib[m_cnt++] = END_SYMBOL;
		        } else {
		            mcode_starts.push(m_cnt);
		            x = morse_dict[c];
		            for (j=0;j<x.length;j++)
		                mcode_crib[m_cnt++] = x[j];
		            mcode_crib[m_cnt++] = END_SYMBOL;
		        }
		    }
		}
	}
    crib_len = cnt;
    var crib_text = s.toUpperCase();
    s = '';
    for (i=0;i<m_cnt;i++)
        s += mcode_crib[i];

    var ct_str = '', ct_line = '', group_count = 0;
    for (i=0;i<code.length;i++) {
        ct_line += symbols.charAt(code[i]);
        if ((i+1) % 5 == 0) {
            group_count++;
            if (group_count == 10) {
                ct_str += ct_line + '\n';
                ct_line = '';
                group_count = 0;
            } else {
                ct_line += ' ';
            }
        }
    }
    if (ct_line.length > 0) ct_str += ct_line;

 out_str = ct_str + '\n\n' + "Morse code for crib \""+crib_text+"\" is: "+s+" \n\nNote: Positions start at 0\n\n";

	for (crib_pos=0;crib_pos<code.length;crib_pos++) {
		if (crib_pos == 0) {
			var strip = 0;
			while (strip < mcode_crib.length && mcode_crib[strip] == 'x') strip++;
			eff = mcode_crib.slice(strip);
		} else if (mcode_crib[0] != 'x') {
			eff = ['x'].concat(mcode_crib);
		} else {
			eff = mcode_crib.slice();
		}
		get_crib_patterns(eff, 0);
		if (crib_pos + crib_pattern.length > code.length) break;
		result = test_pos(crib_pos);
		if (result != -1 && !has_xxx_boundary(crib_pos, eff, 0)) {
			out_str += format_crib_match(crib_pos, eff, 0);
		}
	}

	for (crib_pos=1;crib_pos<code.length;crib_pos++) {
		eff = mcode_crib[0] != 'x' ? ['x'].concat(mcode_crib) : mcode_crib.slice();
		get_crib_patterns(eff, 1);
		if (crib_pos + crib_pattern.length > code.length) break;
		result = test_pos(crib_pos);
		if (result != -1 && !has_xxx_boundary(crib_pos, eff, 1)) {
			out_str += format_crib_match(crib_pos, eff, 1);
		}
	}

	for (crib_pos=1;crib_pos<code.length;crib_pos++) {
		eff = mcode_crib[0] != 'x' ? ['x'].concat(mcode_crib) : mcode_crib.slice();
		get_crib_patterns(eff, 2);
		if (crib_pos + crib_pattern.length > code.length) break;
		result = test_pos(crib_pos);
		if (result != -1 && !has_xxx_boundary(crib_pos, eff, 2)) {
			out_str += format_crib_match(crib_pos, eff, 2);
		}
	}

	document.getElementById('output_area').value = out_str;
	
}

function get_crib_patterns(mcode, first_pos){
    var i, n, cnt, full_len;
    crib_pattern = [];
    cnt = 0;
    if (first_pos == 0){
        full_len = 3*Math.floor(mcode.length/3);
        for (i=0;i<full_len;i=i+3){
            n = morse_order.indexOf(mcode[i]+mcode[i+1]+mcode[i+2]);
            crib_pattern[cnt++] = symbols.charAt(n);
        }
    } else if (first_pos == 1){
        full_len = 3*Math.floor((mcode.length-2)/3);
        for (i=2;i<full_len;i=i+3){
            n = morse_order.indexOf(mcode[i]+mcode[i+1]+mcode[i+2]);
            crib_pattern[cnt++] = symbols.charAt(n);
        }
    } else {
        full_len = 3*Math.floor((mcode.length-1)/3);
        for (i=1;i<full_len;i=i+3){
            n = morse_order.indexOf(mcode[i]+mcode[i+1]+mcode[i+2]);
            crib_pattern[cnt++] = symbols.charAt(n);
        }
    }
};


function has_xxx_boundary(crib_pos, eff, first_pos) {
    var N = crib_pattern.length;

    function eff_idx(k, j) {
        if (first_pos == 0) return k*3 + j;
        if (first_pos == 1) return k*3 + j + 2;
        return k*3 + j + 1;
    }

    function check_seqs(seqs) {
        for (var s = 0; s < seqs.length; s++) {
            var a=seqs[s][0], b=seqs[s][1], c=seqs[s][2];
            if (a >= 0 && eff[a]=='x' && eff[b]=='x' && eff[c]=='x') return true;
        }
        return false;
    }

    if (crib_pos > 0) {
        var prev_val = code[crib_pos - 1];
        for (var k = 0; k < N; k++) {
            if (code[crib_pos + k] == prev_val) {
                var ei1 = eff_idx(k,1), ei2 = eff_idx(k,2);
                var seqs;
                if (first_pos == 0)
                    seqs = [[ei1, ei2, 0], [ei2, 0, 1]];
                else if (first_pos == 1)
                    seqs = [[eff_idx(k,0), 0, 1]];
                else
                    seqs = [[eff_idx(k,0), ei1, 0], [ei1, 0, 1]];
                if (check_seqs(seqs)) return true;
                break;
            }
        }
    }

    var next_pos = crib_pos + N;
    if (next_pos < code.length) {
        var next_val = code[next_pos];
        for (var k = 0; k < N; k++) {
            if (code[crib_pos + k] == next_val) {
                var ei0 = eff_idx(k,0), ei1 = eff_idx(k,1);
                var last = eff_idx(N,0) - 1;
                if (check_seqs([[last-1, last, ei0], [last, ei0, ei1]])) return true;
                break;
            }
        }
    }

    return false;
}

function test_pos(start_pos){
var i,j,k,n,c;

  for (i=0;i<crib_pattern.length-1;i++)
    for (j=i+1;j<crib_pattern.length;j++)
      if ( (crib_pattern[i] == crib_pattern[j]) != (code[i+start_pos] == code[j+start_pos]))
        return(-1);
	return(0);
        
} /* end test_pos */

	
	
</script>
