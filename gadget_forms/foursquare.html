<script type="text/javascript">

// undo and redo routines and variables

var undo_array = [];
var redo_array = [];
var undo_index = 0;
var redo_index = 0;

var undo_array2 = [];
var redo_array2 = [];

var undo_pending = [];
var redo_pending = [];


function do_undo(){
    var i,j;

    // a placed crib isn't in the tables yet, so undoing it only removes it from the display
    if (crib_entered == 1) {
        remove_crib();
        return;
    }
    if (undo_index == 0) return;
    redo_array[redo_index] = [];
    redo_array2[redo_index] = [];    
	for (i=0;i<asize;i++) for (j=0;j<asize;j++) {
		redo_array[redo_index][digits.charAt(i)+digits.charAt(j)] = square_key[ digits.charAt(i)+digits.charAt(j) ];
		redo_array2[redo_index][digits.charAt(i)+digits.charAt(j)] = square_key2[ digits.charAt(i)+digits.charAt(j) ];
	}
    redo_pending[redo_index] = Object.assign({}, pending_plaintext);
    redo_index++;
    undo_index--;
	for (i=0;i<asize;i++) for (j=0;j<asize;j++) {
		square_key[ digits.charAt(i)+digits.charAt(j) ] = undo_array[undo_index][digits.charAt(i)+digits.charAt(j)];
		square_key2[ digits.charAt(i)+digits.charAt(j) ] = undo_array2[undo_index][digits.charAt(i)+digits.charAt(j)];
	}
    pending_plaintext = Object.assign({}, undo_pending[undo_index]);
    crib_entered = 0;
    update_keyblock();
    xlate();
}
function do_redo(){
    var i,j;
    
    if (redo_index == 0)
        return;
    redo_index--;
    undo_index++;
	for (i=0;i<asize;i++) for (j=0;j<asize;j++) {
		square_key[ digits.charAt(i)+digits.charAt(j) ] = redo_array[redo_index][digits.charAt(i)+digits.charAt(j)];
		square_key2[ digits.charAt(i)+digits.charAt(j) ] = redo_array2[redo_index][digits.charAt(i)+digits.charAt(j)];
	}
    pending_plaintext = Object.assign({}, redo_pending[redo_index]);
    crib_entered = 0;
    update_keyblock();
    xlate();
}

function update_undo(){
    var i,j;

    undo_array[undo_index] = [];
    undo_array2[undo_index] = [];    
	for (i=0;i<asize;i++) for (j=0;j<asize;j++) {
		undo_array[undo_index][digits.charAt(i)+digits.charAt(j)] = square_key[ digits.charAt(i)+digits.charAt(j) ];
		undo_array2[undo_index][digits.charAt(i)+digits.charAt(j)] = square_key2[ digits.charAt(i)+digits.charAt(j) ];
	}
    undo_pending[undo_index] = Object.assign({}, pending_plaintext);
    undo_index++;
    redo_index = 0;
}


//next definition needed by Internet explorer, firefox already has it
if (!Array.prototype.indexOf)
{
  Array.prototype.indexOf = function(elt /*, from*/)
  {
    var len = this.length;

    var from = Number(arguments[1]) || 0;
    from = (from < 0)
         ? Math.ceil(from)
         : Math.floor(from);
    if (from < 0)
      from += len;

    for (; from < len; from++)
    {
      if (from in this &&
          this[from] === elt)
        return from;
    }
    return -1;
  };
}

var code,code_array,crib_pos,cribtext;
var symbols="abcdefghiklmnopqrstuvwxyz-"; // no j
var wildcard = symbols.indexOf('-');
var digits="0123456789";
var letters="ABCDEFGHIKLMNOPQRSTUVWXYZ-"; // no J
var fire_fox=!document.all;
var dobj, solving_flag =0;
var asize = 5;
var line_len = 90;
var crib_entered=0; // 1 while a placed crib is shown, 2 when the crib fits nowhere
var crib_key = {};
var crib_key2 = {};
var pair_line_limit=28;
var old_xlation;

//try associative array for key
var square_key = new Array();
var square_key2 = new Array();
var rows_selected = new Array();
var columns_selected = new Array();
var columns_selected2 = new Array();

// plaintext typed at a pair position before both of its letters are known, e.g. '-v'
var pending_plaintext = {};
var selected_plaintext_pos = -1;
var selected_plaintext_half = 0;
var selected_key_id = '';

var data;

function reset_key() {
	for (i=0;i<asize;i++) for (j=0;j<asize;j++) {
		square_key[ digits.charAt(i)+digits.charAt(j) ] = '-';
		square_key2[ digits.charAt(i)+digits.charAt(j) ] = '-';
	}
	pending_plaintext = {};
    undo_index = redo_index = 0;
    update_undo_buttons();
}

function update_undo_buttons() {
	document.getElementById('undo_button').disabled = undo_index == 0 && crib_entered != 1;
	document.getElementById('redo_button').disabled = redo_index == 0;
}

function input_ok() {
	var s='Ciphertext: (Paste the cipher into this box, or type it and click outside the box)<BR>';
	s=s+'<TEXTAREA id=cipher_place style="font-family:monospace" name=output_area rows=9 cols=90></TEXTAREA><BR>';
	
	document.getElementById('outputblock').innerHTML=s;		
}


function setup_code_pairs() {
	var text;
	data = document.ciphertext.cipher_place.value;
	text = data.toUpperCase().replace(/J/g, 'I');
	state=0;
	code = '';
	for (i=0;i<text.length;i++) {
		c = text.charAt(i);
		if (c != '-' && letters.indexOf(c) != -1) {
			if (state==0) {
				code = code+c;
				state=1;
			}
			else {
				code = code+c+' ';
				state=0;
			}
		}
	}
	solving_flag=1;
	if (state) {
		alert("Cipher has odd number of letters!");
		solving_flag=0;
		return;
	}
	code_array = code.split(' ');		
	old_xlation = ['--'];
	for (i = 0;i<code_array.length-1;i++)
		old_xlation[i]= '--';
    undo_index = redo_index = 0;
    update_undo_buttons();
}

function key_lookup(c) { // see if letter pair c is represented in the keysquare
	var c1,p1,c2,p2,pr;
	var row1, col1,row2,col2,flag,cr,cc;
	var key = shown_key(), key2 = shown_key2();
	
//	s = "looking up "+c;
//	document.debug.output_area.value= s; 	
	
	c1 = c.charAt(0);
	c1 = c1.toLowerCase();
	flag = 0;
	for (i=0;i<5;i++){
		cr = digits.charAt(i);
		for (j=0;j<5;j++){
			cc = digits.charAt(j);
			if ( key2[cr+cc] == c1){
				row1 = i;
				col1 = j;
				flag = 1;
				break;
			}
		}
		if ( flag == 1) break;
	}
	if ( flag == 0) return(['--',['55','55']]); // letter c1 not found in key square
//	s = "found row1 col1 ";
//	document.debug.output_area.value= s; 	
	
	c2 = c.charAt(1);
	c2 = c2.toLowerCase();	
	flag = 0;
	for (i=0;i<5;i++){
		cr = digits.charAt(i);
		for (j=0;j<5;j++){
			cc = digits.charAt(j);
			if ( key[cr+cc] == c2){
				row2 = i;
				col2 = j;
				flag = 1;
				break;
			}
		}
		if ( flag == 1) break;
	}
	if ( flag == 0) return(['--',['55','55']]); // letter c2 not found in key square 2
	// corners of rectangle
	index = 5*row1+col2;
	r = symbols.charAt(index);	
	index = 5*row2+col1;
	r += symbols.charAt(index);		
	return( [r,['55','55']]);
}



function xlate() {
	var state,str,limit,pos,pl,cnt,numb_pairs,c,changed;
	if (solving_flag ==0) {
		setup_code_pairs();
		if (solving_flag==0) return;//odd number of letters!
	}
	selected_plaintext_pos = -1;
	str='';
	//str='<style="font-family:monospace; font-size:15px;">';
	limit=pair_line_limit;
	numb_pairs=code_array.length-1;//final entry not a code pair
	if (numb_pairs<limit)
		limit = numb_pairs;
	pos=0;
	cnt=0;
	pl='';
	while (pos<numb_pairs ) {
		if (crib_entered == 1 && 2*pos+1 >= crib_pos && 2*pos < crib_pos+cribtext.length)
			str += '<font color="red">'+code_array[pos]+'</font> ';
		else
			str += code_array[pos]+' ';

		c = current_plaintext(pos);
		if (c.indexOf('-') == -1 && crib_entered != 1)
			delete pending_plaintext[pos];
		changed = old_xlation[pos] != c;
		old_xlation[pos] = c;
		pl += plaintext_span(pos, 0, c, changed) + plaintext_span(pos, 1, c, changed) + '&nbsp;';
		pos++;
		cnt++;
		if (cnt>=limit) {
			//str=str+'\n'+pl+'\n';
			str = str+'<br><font color="blue">'+pl+'</font><br>'
			if (pos < numb_pairs)
				str += '<br>';
			pl='';
			cnt=0;
			if (pos+pair_line_limit>numb_pairs)
				limit = numb_pairs-pos;;
		}
	}
	document.getElementById('outputblock').innerHTML=str;
	update_undo_buttons();
}

// While a crib is shown, the tables are displayed with the crib's letters added
function shown_key() {
	return(crib_entered == 1 ? crib_key : square_key);
}

function shown_key2() {
	return(crib_entered == 1 ? crib_key2 : square_key2);
}

function current_plaintext(pos) {
	var plaintext = key_lookup(code_array[pos])[0];
	if (plaintext == '--' && pos in pending_plaintext)
		plaintext = pending_plaintext[pos];
	return(plaintext);
}

function plaintext_span(pos, half, plaintext, changed) {
	var style = changed ? 'cursor:pointer;color:red' : 'cursor:pointer';
	return('<span id="pt'+pos+'_'+half+'" onclick="select_plaintext('+pos+','+half+')" style="'+style+'">'+plaintext.charAt(half)+'</span>');
}

function clear_selection() {
	if (selected_plaintext_pos != -1)
		document.getElementById('pt'+selected_plaintext_pos+'_'+selected_plaintext_half).style.background = '';
	if (selected_key_id != '')
		document.getElementById(selected_key_id).parentElement.style.background = 'white';
	selected_plaintext_pos = -1;
	selected_key_id = '';
}

function select_plaintext(pos, half) {
	clear_selection();
	selected_plaintext_pos = pos;
	selected_plaintext_half = half;
	document.getElementById('pt'+pos+'_'+half).style.background = 'yellow';
}

// the highlight goes on the bordered box around the cell's letter
function select_key_cell(id) {
	clear_selection();
	selected_key_id = id;
	document.getElementById(id).parentElement.style.background = 'yellow';
}

function erase_from_square(square, letter) {
	var cell;
	for (cell in square)
		if (square[cell] == letter)
			square[cell] = '-';
}

function place_in_square(square, cell, letter) {
	if (letter != '-')
		erase_from_square(square, letter);
	square[cell] = letter;
}

function square_cell(row, column) {
	return(digits.charAt(row)+digits.charAt(column));
}

function start_key_change() {
	clear_selection();
	update_undo();
}

function enter_key_letter(id, letter) {
	var square = id.slice(-1) == '2' ? square_key2 : square_key;
	start_key_change();
	place_in_square(square, id.slice(0,2), letter);
	update_keyblock();
	xlate();
}

// A plaintext pair fixes both of its ciphertext letters at once, so a pair typed one letter
// at a time is held in pending_plaintext until it is complete.
function enter_plaintext_letter(pos, half, letter) {
	var plaintext = current_plaintext(pos);
	var new_plaintext = half == 0 ? letter+plaintext.charAt(1) : plaintext.charAt(0)+letter;
	var ciphertext = code_array[pos].toLowerCase();
	var p1 = symbols.indexOf(new_plaintext.charAt(0));
	var p2 = symbols.indexOf(new_plaintext.charAt(1));

	if (new_plaintext == plaintext) {
		clear_selection();
		return;
	}
	start_key_change();
	if (new_plaintext.indexOf('-') == -1) {
		delete pending_plaintext[pos];
		place_in_square(square_key2, square_cell(Math.floor(p1/5), p2%5), ciphertext.charAt(0));
		place_in_square(square_key, square_cell(Math.floor(p2/5), p1%5), ciphertext.charAt(1));
	}
	else {
		if (plaintext.indexOf('-') == -1) {
			erase_from_square(square_key2, ciphertext.charAt(0));
			erase_from_square(square_key, ciphertext.charAt(1));
		}
		if (new_plaintext == '--')
			delete pending_plaintext[pos];
		else
			pending_plaintext[pos] = new_plaintext;
	}
	update_keyblock();
	xlate();
}

function type_letter(e) {
	var letter;
	if ((selected_plaintext_pos == -1 && selected_key_id == '') || e.ctrlKey || e.altKey || e.metaKey || e.target.tagName == 'TEXTAREA')
		return;
	if (e.key == 'Escape') {
		clear_selection();
		return false;
	}
	letter = (e.key == 'Delete' || e.key == 'Backspace' || e.key == ' ') ? '-' : e.key.toLowerCase().replace('j', 'i');
	if (letter.length != 1 || symbols.indexOf(letter) == -1)
		return;
	crib_entered = 0;
	if (selected_key_id != '')
		enter_key_letter(selected_key_id, letter);
	else
		enter_plaintext_letter(selected_plaintext_pos, selected_plaintext_half, letter);
	return false;
}
document.onkeydown = type_letter;

function key_cell_color(square, crib_square, cell) {
	return(crib_entered == 1 && crib_square[cell] != square[cell] ? 'red' : 'blue');
}

	s=s+'&nbsp&nbsp<span width="75" height = "75" >';

			v = key[c].toUpperCase();
			s = s+'<span width="75" height="75" style="border: 2px solid black;background: white;"  >';
			s=s+'&nbsp<span width="75" height = "75" id ="'+c+'keymatrix" class="'+c+'keyblock" style="color:'+key_cell_color(square_key, crib_key, c)+'">';
			s=s+v+'</span> </span>';
		}
		s =s + '&nbsp &nbsp';
		//second row of key block cells
		for (j=0;j<5;j++) {
			cc=digits.charAt(j);
			c = cr+cc;
			s = s+'<span width="75" height="75" style="border: 2px solid black;background: white;"  >';
			s=s+'&nbsp<span width="75" height = "75"  style="color:blue">';
			s=s+symbols.charAt(5*i+j)+'</span> </span>';
		}
		
		s=s+'&nbsp <br>';	
	}	
	s=s+'<br>';	
	
	document.getElementById('keyblock').innerHTML=s;	
	selected_key_id = '';

}

function start_over() {
	if (solving_flag==0) {
		data = document.ciphertext.cipher_place.value;
	}
	crib_entered=0;
	reset_key();
	keyblock_setup()
	input_ok();
	document.ciphertext.cipher_place.value=data;
	solving_flag=0;
}

function reset() {
	do_erase = confirm("Erase the current cipher?")
	if ( do_erase == true) {
		crib_entered=0;
		reset_key();
		keyblock_setup()
		input_ok();
		document.ciphertext.cipher_place.value='';
		solving_flag=0;
	}
}	



function redirect() {
	window.location="Foursquare_lowres.html";
}

function screen_check() {
	if (screen.width <1000) {
		redirect();
	}
}


function set_original_buttons() {
	str = '<INPUT onclick=start_over(); type=button value="start over" >';
	str = str+'<INPUT onclick=reset(); type=button value="erase cipher" ><br><br>';
    str += '<INPUT onclick=do_undo(); id = "undo_button" type=button value="undo" disabled >';
    str += '<INPUT onclick=do_redo(); id = "redo_button" type=button value="redo" disabled ><br>';
    str += '<br><br>';
    str += '<INPUT onclick=save_to_disk(); type=button value="save work to disk" >';
    str += '<INPUT onclick=get_from_disk(); type=button value="retrieve work from disk" ><br><br>';
    str += '<INPUT onclick=clear_disk(); type=button value="clear work from disk" ><br><br>';
    str += '<INPUT onclick=show_frequency_count(); type=button value="show frequency count" title="List the ciphertext pairs by frequency, with any plaintext found for them" >';
    
	document.getElementById('button_actions').innerHTML= str;	
}

// The crib is placed on copies of the key tables, so the tables themselves are left alone
// until the crib is written into them with update_tables().
function ck_crib_pos() {
	var i,p1,p2,ciphertext,last;
	var start = crib_pos & 1; // an odd crib_pos starts the crib on the second letter of a pair
	crib_key = Object.assign({}, square_key);
	crib_key2 = Object.assign({}, square_key2);
	for (i=start;i+1<cribtext.length;i+=2) {
		ciphertext = code_array[(crib_pos+i)/2].toLowerCase();
		p1 = symbols.indexOf(cribtext.charAt(i));
		p2 = symbols.indexOf(cribtext.charAt(i+1));
		if (p1 == wildcard || p2 == wildcard)
			continue;
		if (!place_crib_letter(crib_key2, square_cell(Math.floor(p1/5), p2%5), ciphertext.charAt(0)))
			return(0);
		if (!place_crib_letter(crib_key, square_cell(Math.floor(p2/5), p1%5), ciphertext.charAt(1)))
			return(0);
	}
	if (start == 1) {
		ciphertext = code_array[(crib_pos-1)/2].toLowerCase();
		p2 = symbols.indexOf(cribtext.charAt(0));
		if (p2 != wildcard && !(placed_in_line(crib_key2, ciphertext.charAt(0), 1, p2%5)
				&& placed_in_line(crib_key, ciphertext.charAt(1), 0, Math.floor(p2/5))))
			return(0);
	}
	last = crib_pos+cribtext.length-1;
	if ((last & 1) == 0) { // the crib ends on the first letter of a pair
		ciphertext = code_array[last/2].toLowerCase();
		p1 = symbols.indexOf(cribtext.charAt(cribtext.length-1));
		if (p1 != wildcard && !(placed_in_line(crib_key2, ciphertext.charAt(0), 0, Math.floor(p1/5))
				&& placed_in_line(crib_key, ciphertext.charAt(1), 1, p1%5)))
			return(0);
	}
	return(1);
}

function place_crib_letter(square, cell, letter) {
	var other;
	if (square[cell] != '-')
		return(square[cell] == letter);
	for (other in square)
		if (square[other] == letter)
			return(false);
	square[cell] = letter;
	return(true);
}

// A crib letter in a half-covered pair fixes only the row or column of each ciphertext letter.
// axis is 0 for a row, 1 for a column.
function placed_in_line(square, letter, axis, line) {
	var cell;
	for (cell in square)
		if (square[cell] == letter)
			return(cell.charAt(axis) == digits.charAt(line));
	return(true);
}

// Searches round the whole cipher, so dragging past either end wraps to the next match.
function drag_crib(step) {
	var positions = 2*(code_array.length-1)-cribtext.length+1;
	var tries;
	clear_selection();
	for (tries=0;tries<positions;tries++) {
		crib_pos = (crib_pos+step+positions)%positions;
		if (ck_crib_pos()) {
			crib_entered = 1;
			update_keyblock();
			xlate();
			return;
		}
	}
	crib_entered = 2;
	update_keyblock();
	xlate();
	alert('The crib fits nowhere in the cipher with the current key tables.');
}

function enter_crib() {
	var crib = prompt('Enter crib');
	var i,c;
	if (crib == null)
		return;
	if (solving_flag == 0) {
		setup_code_pairs();
		if (solving_flag == 0) return; //odd number of letters!
	}
	cribtext = '';
	crib = crib.toLowerCase().replace(/j/g, 'i');
	for (i=0;i<crib.length;i++) {
		c = crib.charAt(i);
		if (symbols.indexOf(c) != -1) //allow '-' chars in crib!
			cribtext += c;
	}
	if (cribtext == '')
		return;
	crib_pos = -1;
	drag_crib(1);
}

function drag_right() {
	if (crib_entered == 0) {
		enter_crib();
		return;
	}
	drag_crib(1);
}

function drag_left() {
	if (crib_entered == 0) {
		enter_crib();
		return;
	}
	drag_crib(-1);
}

function update_tables() {
	var cell;
	if (crib_entered != 1)
		return;
	start_key_change();
	for (cell in crib_key)
		square_key[cell] = crib_key[cell];
	for (cell in crib_key2)
		square_key2[cell] = crib_key2[cell];
	crib_entered = 0;
	update_keyblock();
	xlate();
}

function remove_crib() {
	if (crib_entered == 0)
		return;
	clear_selection();
	crib_entered = 0;
	update_keyblock();
	xlate();
}

function save_to_disk(){
	var i,j,cell,key_text,key2_text;

	if (solving_flag == 0)
		data = document.ciphertext.cipher_place.value;
	if (data.trim() == '') {
		alert('No cipher entered.');
		return;
	}
	key_text = '';
	key2_text = '';
	for (i=0;i<asize;i++) for (j=0;j<asize;j++) {
		cell = digits.charAt(i)+digits.charAt(j);
		key_text += square_key[cell];
		key2_text += square_key2[cell];
	}
	try {
		localStorage.setItem("foursquare.cipher", data);
		localStorage.setItem("foursquare.key", key_text);
		localStorage.setItem("foursquare.key2", key2_text);
		localStorage.setItem("foursquare.pending", JSON.stringify(pending_plaintext));
	} catch (e) {
		alert('Work not saved: '+e.message);
		return;
	}
	alert("Work saved on disk");
}

function get_from_disk(){
	var i,j,cell,cipher_text,key_text,key2_text,pending_text;

	try {
		cipher_text = localStorage.getItem("foursquare.cipher");
		key_text = localStorage.getItem("foursquare.key");
		key2_text = localStorage.getItem("foursquare.key2");
		pending_text = localStorage.getItem("foursquare.pending");
	} catch (e) {
		alert('Work not retrieved: '+e.message);
		return;
	}
	if (cipher_text == null) {
		alert("No cipher stored");
		return;
	}
	if (key_text == null || key2_text == null || key_text.length != asize*asize || key2_text.length != asize*asize) {
		alert("The saved work is incomplete, so nothing was retrieved.");
		return;
	}
	data = cipher_text;
	crib_entered = 0;
	reset_key();
	input_ok();
	document.ciphertext.cipher_place.value = data;
	solving_flag = 0;
	for (i=0;i<asize;i++) for (j=0;j<asize;j++) {
		cell = digits.charAt(i)+digits.charAt(j);
		square_key[cell] = key_text.charAt(asize*i+j);
		square_key2[cell] = key2_text.charAt(asize*i+j);
	}
	pending_plaintext = JSON.parse(pending_text || '{}');
	update_keyblock();
	xlate();
}

function clear_disk(){
	localStorage.removeItem("foursquare.cipher");
	localStorage.removeItem("foursquare.key");	
	localStorage.removeItem("foursquare.key2");		
	localStorage.removeItem("foursquare.pending");
	alert("work cleared from disk");
}

function read_cipher() {
	if (solving_flag == 1)
		return true;
	if (document.ciphertext.cipher_place.value.trim() == '') {
		alert('No cipher entered.');
		return false;
	}
	setup_code_pairs();
	if (solving_flag == 0)
		return false;
	update_keyblock();
	xlate();
	return true;
}

function read_entered_cipher(e) {
	if (e.target.id == 'cipher_place' && e.target.value.trim() != '')
		read_cipher();
}
document.addEventListener('change', read_entered_cipher);
// the pasted text is only in the box once the paste event has been handled
document.addEventListener('paste', function (e) {
	setTimeout(function () { read_entered_cipher(e); }, 0);
});

function show_popup(text) {
	document.getElementById('popup_text').textContent = text;
	document.getElementById('popup').style.display = 'flex';
}

function close_popup() {
	document.getElementById('popup').style.display = 'none';
}

function show_frequency_count() {
	var counts = {};
	var i,pair,pairs,width,plaintext,lines;
	if (!read_cipher())
		return;
	for (i=0;i<code_array.length-1;i++)
		counts[code_array[i]] = (counts[code_array[i]] || 0) + 1;
	pairs = Object.keys(counts).sort(function(a, b) { return counts[b]-counts[a] || (a < b ? -1 : 1); });
	width = String(counts[pairs[0]]).length;
	lines = [];
	for (i=0;i<pairs.length;i++) {
		pair = pairs[i];
		plaintext = key_lookup(pair)[0];
		lines.push(pair+'  '+String(counts[pair]).padStart(width)+(plaintext == '--' ? '' : ' ('+plaintext+')'));
	}
	show_popup(lines.join('\n'));
}
